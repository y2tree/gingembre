<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Gingembre</title>
        <style>
                body {
                    font-family: system-ui, sans-serif;
                    background: #e3edff;
                    max-width: 700px;
                    margin: 0 auto;
                    padding: 24px;
                    
                }

                h1 {
                    font-size: 28px;
                    text-align: left;
                }
                .carte {
                    background-color: #1166ef;
                    border-radius: 12px;
                    padding: 14px 16px;
                    margin-bottom: 10px;
                    display: flex;
                    justify-content: space-between;
                    border: 6px solid #ffffff;
                }
                .etoile {
                    cursor: pointer;
                    font-size: 20px;
                }
        </style>
    </head>

    <body>
        <h1>Gingembre pas trop</h1>

        <img width="300" height="300"
             src="https://jnrfr.fr/wp-content/uploads/2026/05/jnr-logo.webp"
             alt="Logo JNR">

        <!-- Boîte vide : c'est le JS qui la remplit -->
        <div id="listeSaveurs"></div>

        <script>

            // --- Les données ---
            const puffs = [
                { saveur: "Apple pear", note: 0 },
                { saveur: "Banana Ice", note: 0 },
                { saveur: "Berry Burst", note: 0 },
                { saveur: "Black Ice", note: 0 },
                { saveur: "Blue cherry explosion", note: 0 },
                { saveur: "Blue Razz Cherry", note: 0 },
                { saveur: "Blue Razz Ice", note: 0 },
                { saveur: "Blueberry Cherry Cranberry", note: 0 },
                { saveur: "Blueberry Kiwi", note: 0 },
                { saveur: "Blueberry Raspberry", note: 0 },
                { saveur: "Blueberry Raspberry Cherry", note: 0 },
                { saveur: "Cherry Berry", note: 0 },
                { saveur: "Cherry Ice", note: 0 },
                { saveur: "Cherry Peach Lemonade", note: 0 },
                { saveur: "Cherry Watermelon Freeze", note: 0 },
                { saveur: "Cool Mint", note: 0 },
                { saveur: "Grape Ice", note: 0 },
                { saveur: "Gummy Bear", note: 0 },
                { saveur: "Hawaii", note: 0 },
                { saveur: "JNR Blue Cocoa Mousseux", note: 0 },
                { saveur: "JNR Sparkling Cherry", note: 0 },
                { saveur: "JNR Tangy fruit Berries", note: 0 },
                { saveur: "JNR Watermelon Rooty Fizz", note: 0 },
                { saveur: "Kiwi Watermelon Ice", note: 0 },
                { saveur: "Lady Killa", note: 0 },
                { saveur: "Lemon Lime", note: 0 },
                { saveur: "Love 66", note: 0 },
                { saveur: "Mi Amor", note: 0 },
                { saveur: "Mixed Berries", note: 0 },
                { saveur: "Mr Blue", note: 0 },
                { saveur: "Passion Fruit Kiwi", note: 0 },
                { saveur: "Peach Berry", note: 0 },
                { saveur: "Peach Mango Pineapple", note: 0 },
                { saveur: "Raspberry rhubarb", note: 0 },
                { saveur: "Raspberry Rouge Gumdrop", note: 0 },
                { saveur: "Skittles", note: 0 },
                { saveur: "Sour Apple Ice", note: 0 },
                { saveur: "Strawberry Banana", note: 0 },
                { saveur: "Strawberry Ice", note: 0 },
                { saveur: "Strawberry Kiwi", note: 0 },
                { saveur: "Strawberry Watermelon Ice", note: 0 },
                { saveur: "Triple Melon", note: 3 },
                { saveur: "Tropical fruit", note: 0 },
                { saveur: "Watermelon Bubblegum", note: 0 },
                { saveur: "Watermelon Ice", note: 0 },
                { saveur: "Watermelon Lychee", note: 0 },
                { saveur: "White Peach Razz", note: 0 }
            ];

            // --- L'affichage ---
            function afficherPuffs() {
                const conteneur = document.getElementById("listeSaveurs");
                conteneur.innerHTML = "";

                for (let i = 0; i < puffs.length; i++) {
                    const puff = puffs[i];
                    const carte = document.createElement("div");
                    carte.className = "carte";

                    let etoiles = "";
                    for (let n =1; n <= 5; n++) {
                        if (n <= puff.note) {
                            etoiles += `<span class="etoile" onclick="noter(${i}, ${n})">&#9733;</span>`;
                        } else {
                            etoiles += `<span class="etoile" onclick="noter(${i}, ${n})">&#9734;</span>`;
                        }
                    }
                    carte.innerHTML = `<span>${puff.saveur}</span> <span>${etoiles}</span>`;
                    conteneur.appendChild(carte);
                }
            }
            function noter(i, n) {
                puffs[i].note = n;
                localStorage.setItem("puffs", JSON.stringify(puffs));
                afficherPuffs();
            }
            afficherPuffs();

        </script>



        <!-- <h4>Plutôt puff goût piff ou goût paff ???</h4> -->
    </body>
</html>
